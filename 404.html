<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata | Valeroad</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14181B">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Big Shoulders';src:url(/assets/font/big-shoulders-latin.woff2) format('woff2');
  font-weight:400 800;font-style:normal;font-display:swap}
@font-face{font-family:'Saira';src:url(/assets/font/saira-latin.woff2) format('woff2');
  font-weight:400 700;font-style:normal;font-display:swap}
:root{
  --asfalto:#14181B; --asfalto-2:#1C2226; --asfalto-3:#262D32;
  --ink:#EEF1F2; --ink-soft:#A6B0B5;
  --ambra:#FFA51F;
  --display:'Big Shoulders','Arial Narrow',system-ui,sans-serif;
  --testo:'Saira',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--asfalto);color:var(--ink);font:17px/1.65 var(--testo)}
main{max-width:70ch;margin:0 auto;padding:48px 20px 72px}
h1{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;
  font-size:clamp(2.2rem,7vw,3.2rem);line-height:1;margin:0 0 12px}
h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:1.5rem;
  line-height:1.1;margin:44px 0 8px;color:var(--ambra)}
h3{font-size:1.05rem;margin:24px 0 4px}
p,li{color:var(--ink)}
.data{color:var(--ink-soft);margin:0 0 32px}
em{color:var(--ink-soft)}
a{color:var(--ambra);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--ambra);outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:.95rem;margin:12px 0}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--asfalto-3);vertical-align:top}
th{color:var(--ink-soft);font-weight:600}
.indietro{display:inline-block;margin-top:40px;font-weight:600}
footer{border-top:1px solid var(--asfalto-3);background:var(--asfalto-2);color:var(--ink-soft);font-size:.9rem}
footer .wrap{max-width:70ch;margin:0 auto;padding:24px 20px;display:flex;flex-wrap:wrap;gap:6px 18px}
footer a{color:var(--ink-soft)}
.e404{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.btn{display:inline-block;margin-top:24px;padding:14px 24px;background:var(--ambra);color:var(--asfalto);
  font-weight:700;text-decoration:none;border-radius:6px}
</style>
</head>
<body>
<main class="e404">
<h1>Pagina non trovata</h1>
<p>L'indirizzo che hai aperto non esiste, o non esiste più.</p>
<p>Se sei fermo con il veicolo, chiama: <a href="tel:+393889550746"><strong>388 955 0746</strong></a></p>
<p><a class="btn" href="/">Vai al sito</a></p>
</main>
</body>
</html>
